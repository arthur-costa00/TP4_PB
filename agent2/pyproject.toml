[project]
name = "pb-agent2"
version = "0.3.0"
description = "Arthur Costa — PB TP3 — corretor independente de exercícios"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.143.3", "openai-agents>=0.21.1", "python-dotenv>=1.2.3", "uvicorn>=0.52.3"]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
